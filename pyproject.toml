[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-test-harness"
version = "0.1.0"
description = "In-process end-to-end test framework for the HiveMind protocol"
requires-python = ">=3.9"
dependencies = [
    # The in-process simulator (TopologyBuilder, nodes, recorder, the protocol
    # plugins, fixtures, assertions and scenarios) lives in hivescope. Pulling
    # it in also drags hivemind-core, hivemind-bus-client and the rest of the
    # stack transitively; the remaining bits come from the workspace editable
    # installs.
    "hivescope>=0.5.0a2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-timeout",
    "pytest-cov",
    "websockets>=11",
]
# Live OVOS skill execution through HiveMind (MiniCroft-backed agent). Mirrors
# hivescope's own ``ovos`` extra.
ovos = [
    "hivescope[ovos]>=0.5.0a2",
]
plot = [
    "matplotlib>=3.5",
    "networkx>=3.0",
]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "slow: tests that spin up large topologies (deselect with -m 'not slow')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_test_harness*"]
