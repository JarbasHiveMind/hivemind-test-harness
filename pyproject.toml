[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivescope"
version = "0.1.0"
description = "Hivescope: E2E testing library for HiveMind protocol"
readme = "LIBRARY.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["hivemind", "protocol", "testing", "e2e", "pytest", "fixture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = []  # all come from the workspace editable installs

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-timeout",
    "pytest-cov",
    "websockets>=11",
]
plot = [
    "matplotlib>=3.5",
    "networkx>=3.0",
]
ovos = [
    "ovoscope>=0.13",
    "ovos-core>=0.0.30",
]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "slow: tests that spin up large topologies (deselect with -m 'not slow')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_test_harness*"]
