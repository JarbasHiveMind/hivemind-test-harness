[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-test-harness"
version = "0.1.0"
description = "In-process end-to-end test framework for the HiveMind protocol"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # The in-process simulator (TopologyBuilder, nodes, recorder, the protocol
    # plugins, fixtures, assertions and scenarios) lives in hivescope. Pulling
    # it in also drags hivemind-core, hivemind-bus-client and the rest of the
    # stack transitively; the remaining bits come from the workspace editable
    # installs. 0.5.2a1 carries the loopback-whitelist + ACL re-lookup + metadata
    # repair and floors the bus-client 2.x stack, so no branch/override is needed.
    # 0.6.2a1 is the floor for the 0.6.x API this harness now uses: add_relay()
    # returns a RelayNode (relay.listener is the downstream master),
    # MessageRecorder.snapshot(), assert_ping_responded(since=/flood_id=) and
    # assert_policy_denied(strict=, deny_code=).
    "hivescope>=0.6.2a1",
    # protocol v3 (Noise XXpsk2) floor for tests/test_protocol_v3_noise.py: the
    # Noise handshake, the password-strength backstop and derive-psk provisioning
    # all require this stack. Prerelease floors so pip resolves them without --pre.
    "hivemind-core>=4.11.4a2",
    "hivemind_bus_client>=0.10.1a1",
    "poorman-handshake>=2.0.0a1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-timeout",
    "pytest-cov",
    "websockets>=11",
    # test_protocol_v3_noise reads the hub's advertised handshake params over a
    # raw (sync) websocket to assert the min_protocol_version floor.
    "websocket-client>=1.6",
    # cross-repo packages whose code the harness imports directly in tests
    # (e.g. test_audio_transformers imports hivemind_audio_binary_protocol).
    "hivemind-audio-binary-protocol",
    # DISCOVERY-1 conformance: tests/test_spec_musts.py asserts the real mDNS
    # announcement record and the LocalPresence defaults. 0.0.5a1 is the first
    # release where LocalPresence defaults upnp=False (HiveMind-presence#17),
    # which test_presence_library_also_defaults_ssdp_off asserts outright — an
    # older presence fails it rather than skipping, so this floor is load-bearing.
    "hivemind-presence>=0.0.5a1",
    # The announcement tests build a real zeroconf ServiceInfo and read the
    # record back. hivemind-presence keeps zeroconf in its own `test` extra
    # (it is an optional LGPL transport for end users), so depending on the
    # package alone does not pull it in.
    "zeroconf",
]
# Live OVOS skill execution through HiveMind (MiniCroft-backed agent). Mirrors
# hivescope's own ``ovos`` extra, plus the intent-pipeline plugins MiniCroft
# needs to actually match intents (ovos-adapt-parser / ovos-padatious /
# common-query / ocp — without them MiniCroft logs "Unknown pipeline matcher").
ovos = [
    "hivescope[ovos]>=0.6.2a1",
    "ovos-core[plugins]>=2.0.0a2",
    # the real agent backend the v3 Noise hub connects to (127.0.0.1:8181);
    # test_protocol_v3_noise boots it as a subprocess to round-trip bus messages.
    "ovos-messagebus>=0.0.13a1",
    "ovos-padatious>=1.4.2,<2.0.0",
    "ovos-skill-hello-world",
    "ovos-skill-date-time",
    # Skills this extra deliberately leaves out: ovos-skill-volume,
    # ovos-skill-fallback-unknown, and the rest of the e2e cast. Every module
    # that needs one guards itself with skill_missing() and skips, so the
    # volume/PHAL and most ACL scenarios never run in CI — they are local-run
    # coverage. Add a skill here only together with the CI time it costs.
    # test_solver_harness exercises HiveMindSolver (module ovos_hivemind_solver)
    "ovos-solver-hivemind-plugin",
    # SG-7: the ovos-m2v intent pipeline ships sklearn-pickled models trained
    # on sklearn 1.6.x; sklearn>=1.7 unpickles them with InconsistentVersion
    # warnings and degraded matching. Pin to the training series.
    "scikit-learn<1.7",
]
plot = [
    "matplotlib>=3.5",
    "networkx>=3.0",
]

[tool.pytest.ini_options]
# Fast in-process modules finish well inside 30s. The OVOS-backed e2e modules
# boot a MiniCroft (up to a 180s READY budget), so they raise the limit
# themselves with a module-level ``pytest.mark.timeout``.
timeout = 30
# --strict-markers: an unregistered marker is a typo, not a silent no-op.
addopts = "--strict-markers"
markers = [
    "slow: tests that spin up large topologies (deselect with -m 'not slow')",
]

[tool.uv]
# This stack is prerelease-only (ovos-core, hivescope, hivemind-core, etc. all
# publish as aN). Lock resolution must allow prereleases exactly like every
# CI install path already does (--prerelease=allow / uv pip install --pre) —
# without this, `uv lock` applies its own no-prerelease default and produces
# spurious backtracking/conflicts unrelated to the actual dependency graph.
prerelease = "allow"

[tool.setuptools.packages.find]
where = ["."]
include = ["hivemind_test_harness*"]
