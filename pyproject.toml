[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-test-harness"
version = "0.2.0"
description = "Central HiveMind integration test suite (topology, stress, cross-repo). Built on hivescope."
license = {text = "AGPL-3.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["hivemind", "protocol", "testing", "e2e", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = [
    "hivescope @ git+https://github.com/JarbasHiveMind/hivescope@dev",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-timeout",
    "pytest-cov",
    "websockets>=11",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
    "networkx>=3.0",
]
ovos = [
    "ovoscope>=0.13",
    "ovos-core>=0.0.30",
]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "slow: tests that spin up large topologies (deselect with -m 'not slow')",
]
