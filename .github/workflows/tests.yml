name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  fast:
    name: Protocol tests (FakeBus)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run fast protocol tests
        # live-OVOS (slow) and embedded-runtime tests run elsewhere
        run: >-
          pytest tests/ -m "not slow and not embedded" --tb=short -q
          --ignore=tests/test_embedded_clients.py
          --ignore=tests/test_embedded_comprehensive.py
          --ignore=tests/test_embedded_interop.py
          --ignore=tests/test_micropython_e2e.py
          --ignore=tests/test_js_e2e.py

  ovoscope:
    name: Live-OVOS tests (ovoscope/MiniCroft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y python3-dev swig
      - name: Install (with ovoscope + a test skill)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ovoscope]
      - name: Run live-OVOS tests
        run: pytest tests/ -m slow --tb=short -q
