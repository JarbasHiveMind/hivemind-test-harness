name: Tests

on:
  push:
    branches: [ master, dev, main ]
  pull_request:
    branches: [ master, dev, main ]

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        # --pre: the HiveMind 2.x stack (hivemind-core 4.6.x / hivemind-bus-client
        # 0.9.x on ovos-bus-client 2.x) is prerelease-only on PyPI. hivescope
        # >=0.5.2a1 (pinned in pyproject) carries the loopback + ACL re-lookup
        # fixes and floors the 2.x stack, so it resolves straight from PyPI.
        uv pip install --prerelease=allow -e .[dev]
        uv pip install pytest-asyncio

    # In-process protocol/topology layer. The OVOS skill-execution, JS,
    # MicroPython/embedded, and matplotlib-plot tests have their own jobs with
    # the extra runtimes they need, so exclude them here. The embedded modules
    # skip themselves without the MicroPython client checkout, so they also run
    # in the required embedded-tests job below.
    - name: Run tests
      run: |
        .venv/bin/python -m pytest tests/ -v --tb=short -m "not slow" \
          --ignore-glob='tests/test_e2e_*.py' \
          --ignore-glob='tests/test_embedded_*.py' \
          --ignore=tests/test_micropython_e2e.py \
          --ignore=tests/test_helloworld_hivemind.py \
          --ignore=tests/test_ovoscope_integration.py \
          --ignore=tests/test_solver_harness.py \
          --ignore=tests/test_js_e2e.py \
          --ignore=tests/test_topology_plots.py

  ovos-e2e:
    # Live OVOS skill-execution layer: routes real utterances through HiveMind
    # into a MiniCroft (ovoscope) and asserts OVOS skill behaviour. Needs the
    # ovos extra (ovos-core[plugins] + intent-pipeline plugins + test skills)
    # and the native FANN lib that ovos-padatious links against.
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install native FANN lib (ovos-padatious / fann2 dependency)
      # ovos-padatious binds the native doublefann shared lib via fann2; without
      # it the padatious pipeline plugin fails to load and padatious-pipeline
      # tests get "Unknown pipeline matcher".
      run: |
        sudo apt-get update
        sudo apt-get install -y libfann2 libfann-dev

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[ovos]
        # websocket-client: test_protocol_v3_noise reads the hub's advertised
        # handshake params over a raw sync websocket. It ships in the dev
        # extra, which this job does not install.
        # matplotlib/networkx: test_topology_plots renders the topology PNGs.
        uv pip install pytest-asyncio pytest-timeout websocket-client
        uv pip install -e .[plot]

    - name: Run OVOS skill-execution E2E tests
      env:
        # libfann2 installs libdoublefann.so.2 under the multiarch lib dir;
        # ensure the dynamic loader finds it when fann2 imports _libfann.
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
      run: |
        # The ovos-m2v intent pipeline caches sklearn-pickled models across
        # sessions; a stale cache poisons matching (SG-7). Clear it first.
        rm -rf ~/.local/share/mycroft/intent_cache
        # ovoscope 0.19.0a1 ships a pytest11 plugin incompatible with pytest 9
        # (OpenVoiceOS/ovoscope#87) — disable it. MiniCroft boot + serial skill
        # handlers are slow, so widen the per-test timeout.
        # Glob the whole test_e2e_* suite instead of naming files: a named
        # list silently drops every module added later, which is how 13
        # modules ended up running in no job at all.
        #
        # Deny-list (--ignore=...): currently EMPTY. Every e2e module that
        # needs a skill this job does not install guards itself with
        # skill_missing()/skipif and skips cleanly. Add an --ignore line here
        # only for a module that cannot run at all, and say why.
        .venv/bin/python -m pytest \
          tests/test_e2e_*.py \
          tests/test_protocol_v3_noise.py \
          tests/test_helloworld_hivemind.py \
          tests/test_ovoscope_integration.py \
          tests/test_solver_harness.py \
          tests/test_topology_plots.py \
          -p no:ovoscope --timeout=300 -v --tb=short

  # Embedded interop, REQUIRED. Every embedded module guards its imports with
  # pytest.importorskip("hivemind.client" / "hivemind.crypto"), so without the
  # MicroPython client checkout the whole file skips cleanly instead of erroring
  # at collection. That makes this job safe to require: it proves the modules
  # still import, collect and (when the checkout is present) pass.
  embedded-tests:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]
        uv pip install pytest-asyncio

    - name: Run embedded interop tests
      run: |
        .venv/bin/python -m pytest tests/test_embedded_interop.py \
          tests/test_embedded_comprehensive.py -v --tb=short

  # The MicroPython client repo is PRIVATE, so CI's default GITHUB_TOKEN cannot
  # check it out and these two modules cannot actually exercise the client.
  # Best-effort until the repo is public or a cross-repo PAT is added; the
  # required embedded-tests job above covers the rest.
  micropython-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Checkout MicroPython client (private — needs a PAT to succeed)
      uses: actions/checkout@v4
      with:
        repository: JarbasHiveMind/hivemind-micropython-client
        path: hivemind-micropython-client
        token: ${{ secrets.HIVEMIND_PAT || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]
        uv pip install pytest-asyncio

    - name: Run MicroPython client E2E tests
      env:
        HIVEMIND_MICROPYTHON_CLIENT: ${{ github.workspace }}/hivemind-micropython-client
      run: |
        .venv/bin/python -m pytest tests/test_micropython_e2e.py \
          tests/test_embedded_clients.py -v --tb=short

  js-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    # The JS driver (test_helpers/js_e2e_driver.mjs) requires the HiveMind-js
    # client; check it out and point HIVEMIND_JS_PATH at its hivemind.js.
    - name: Checkout HiveMind-js
      uses: actions/checkout@v4
      with:
        repository: JarbasHiveMind/HiveMind-js
        ref: dev
        path: hivemind-js-src

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Node.js dependencies
      # local install (not -g) so the driver's `require('ws')` resolves by
      # walking up from test_helpers/ to the repo-root node_modules.
      run: |
        npm install ws

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]

    - name: Run JS E2E tests
      env:
        HIVEMIND_JS_PATH: ${{ github.workspace }}/hivemind-js-src/static/js/hivemind.js
      run: |
        .venv/bin/python -m pytest tests/test_js_e2e.py -v --tb=short
