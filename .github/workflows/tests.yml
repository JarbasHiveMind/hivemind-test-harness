name: Tests

on:
  push:
    branches: [ master, dev, main ]
  pull_request:
    branches: [ master, dev, main ]

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    # The embedded / MicroPython tests import the pure-Python-compatible
    # `hivemind` package straight from the MicroPython client checkout (it has
    # no pyproject, so it is not pip-installable). Place it next to the harness
    # so the tests' path resolver finds it.
    - name: Checkout MicroPython client
      uses: actions/checkout@v4
      with:
        repository: JarbasHiveMind/hivemind-micropython-client
        path: hivemind-micropython-client

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        # --pre: the HiveMind 2.x stack (hivemind-core 4.6.x / hivemind-bus-client
        # 0.9.x on ovos-bus-client 2.x) is prerelease-only on PyPI.
        uv pip install --prerelease=allow -e .[dev]
        # The loopback whitelist + InMemoryClientDatabase.get_client_by_id fixes
        # are not on a published hivescope release yet; install from the branch
        # carrying them so the real-socket e2e passes. Drop once hivescope ships
        # a release with these.
        uv pip install --prerelease=allow \
          "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection"
        uv pip install pytest-asyncio

    # In-process protocol/topology + embedded layer. The OVOS skill-execution,
    # JS, and matplotlib-plot tests have their own jobs (ovos-e2e / js-e2e) with
    # the extra runtimes they need, so exclude them here.
    - name: Run tests
      env:
        HIVEMIND_MICROPYTHON_CLIENT: ${{ github.workspace }}/hivemind-micropython-client
      run: |
        uv run pytest tests/ -v --tb=short -m "not slow" \
          --ignore-glob='tests/test_e2e_*.py' \
          --ignore=tests/test_helloworld_hivemind.py \
          --ignore=tests/test_ovoscope_integration.py \
          --ignore=tests/test_solver_harness.py \
          --ignore=tests/test_js_e2e.py \
          --ignore=tests/test_topology_plots.py

  ovos-e2e:
    # Live OVOS skill-execution layer: routes real utterances through HiveMind
    # into a MiniCroft (ovoscope) and asserts OVOS skill behaviour. Needs the
    # ovos extra (ovos-core[plugins] + intent-pipeline plugins + test skills)
    # and the native FANN lib that ovos-padatious links against.
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install native FANN lib (ovos-padatious / fann2 dependency)
      # ovos-padatious binds the native doublefann shared lib via fann2; without
      # it the padatious pipeline plugin fails to load and padatious-pipeline
      # tests get "Unknown pipeline matcher".
      run: |
        sudo apt-get update
        sudo apt-get install -y libfann2 libfann-dev

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[ovos]
        # hivescope fixes (get_client_by_id/refresh — the second-utterance ACL
        # bug — and the loopback fix) aren't on a published release yet.
        uv pip install --prerelease=allow \
          "hivescope[ovos] @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection"
        uv pip install pytest-asyncio pytest-timeout

    - name: Run OVOS skill-execution E2E tests
      env:
        # libfann2 installs libdoublefann.so.2 under the multiarch lib dir;
        # ensure the dynamic loader finds it when fann2 imports _libfann.
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
      run: |
        # The ovos-m2v intent pipeline caches sklearn-pickled models across
        # sessions; a stale cache poisons matching (SG-7). Clear it first.
        rm -rf ~/.local/share/mycroft/intent_cache
        # ovoscope 0.19.0a1 ships a pytest11 plugin incompatible with pytest 9
        # (OpenVoiceOS/ovoscope#87) — disable it. MiniCroft boot + serial skill
        # handlers are slow, so widen the per-test timeout.
        uv run pytest \
          tests/test_helloworld_hivemind.py \
          tests/test_ovoscope_integration.py \
          tests/test_e2e_session.py \
          tests/test_e2e_ocp.py \
          tests/test_e2e_relay_skills.py \
          tests/test_e2e_skills.py \
          tests/test_e2e_converse.py \
          tests/test_e2e_get_response.py \
          tests/test_e2e_stop.py \
          tests/test_solver_harness.py \
          -p no:ovoscope --timeout=300 -v --tb=short

  micropython-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]
        uv pip install --prerelease=allow \
          "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection"
        uv pip install pytest-asyncio

    - name: Run MicroPython E2E tests
      run: |
        uv run pytest tests/test_micropython_e2e.py -v --tb=short

  js-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Node.js dependencies
      run: |
        npm install -g ws

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]
        uv pip install --prerelease=allow \
          "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection"

    - name: Run JS E2E tests
      run: |
        uv run pytest tests/test_js_e2e.py -v --tb=short
