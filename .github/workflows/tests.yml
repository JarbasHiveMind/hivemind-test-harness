name: Tests

on:
  push:
    branches: [ master, dev, main ]
  pull_request:
    branches: [ master, dev, main ]

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install -e .[dev]
        uv pip install pytest-asyncio

    - name: Run tests
      run: |
        uv run pytest tests/ -v --tb=short -m "not slow"

    - name: Run coverage check
      run: |
        uv run pytest tests/ --cov=hivemind_test_harness --cov-report=term-missing

  micropython-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv pip install -e .[dev]
        uv pip install pytest-asyncio

    - name: Run MicroPython E2E tests
      run: |
        uv run pytest tests/test_micropython_e2e.py -v --tb=short

  js-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Node.js dependencies
      run: |
        npm install -g ws

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python dependencies
      run: |
        uv pip install -e .[dev]

    - name: Run JS E2E tests
      run: |
        uv run pytest tests/test_js_e2e.py -v --tb=short
