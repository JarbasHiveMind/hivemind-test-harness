name: Tests

on:
  push:
    branches: [ master, dev, main ]
  pull_request:
    branches: [ master, dev, main ]

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      # No lockfile, on purpose. This repo tracks the latest prereleases of the
      # whole HiveMind stack by design, and that is the point of a conformance
      # harness: it must fail the day dev breaks, not weeks later.
      #
      # A committed uv.lock did the opposite. Exporting it as a pip constraints
      # file pinned hivemind-core to 4.11.4a2 — the comment here used to claim
      # the HiveMind stack was "deliberately NOT in uv.lock", and it was, so CI
      # quietly stopped testing current core and sat on a PING regression
      # (HiveMind-core#245) that a fresh resolve surfaces immediately.
      #
      # --prerelease=allow: the stack is prerelease-only on PyPI.
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]

    # In-process protocol/topology layer. The OVOS skill-execution, JS,
    # MicroPython/embedded, and matplotlib-plot tests have their own jobs with
    # the extra runtimes they need, so exclude them here. The embedded modules
    # skip themselves without the MicroPython client checkout, so they also run
    # in the required embedded-tests job below.
    # test_protocol_v3_noise.py self-skips here too (no websocket-client extra),
    # but leaving it in still burns collection time and blurs the one-file/
    # one-job partition this list otherwise keeps. It runs for real in the
    # ovos-e2e job's shard 2.
    - name: Run tests
      run: |
        .venv/bin/python -m pytest tests/ -v --tb=short -m "not slow" \
          --ignore-glob='tests/test_e2e_*.py' \
          --ignore-glob='tests/test_embedded_*.py' \
          --ignore=tests/test_micropython_e2e.py \
          --ignore=tests/test_helloworld_hivemind.py \
          --ignore=tests/test_ovoscope_integration.py \
          --ignore=tests/test_solver_harness.py \
          --ignore=tests/test_js_e2e.py \
          --ignore=tests/test_topology_plots.py \
          --ignore=tests/test_protocol_v3_noise.py

  ovos-e2e:
    # Live OVOS skill-execution layer: routes real utterances through HiveMind
    # into a MiniCroft (ovoscope) and asserts OVOS skill behaviour. Needs the
    # ovos extra (ovos-core[plugins] + intent-pipeline plugins + test skills)
    # and the native FANN lib that ovos-padatious links against.
    # Sharded: the serial MiniCroft boots put the whole suite past the
    # 90-minute cap in one job; six shards run in parallel.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    needs: harness-tests
    # Each module boots its own MiniCroft (up to a 180s READY budget) and runs
    # skill handlers serially, so the suite legitimately takes ~55 min. The
    # 360-minute GitHub default hides a hang for hours; 90 minutes leaves room
    # for one slow boot without letting a hang burn the runner.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install native FANN lib (ovos-padatious / fann2 dependency)
      # ovos-padatious binds the native doublefann shared lib via fann2; without
      # it the padatious pipeline plugin fails to load and padatious-pipeline
      # tests get "Unknown pipeline matcher".
      run: |
        sudo apt-get update
        sudo apt-get install -y libfann2 libfann-dev

    - name: Install dependencies
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[ovos]
        # websocket-client: test_protocol_v3_noise reads the hub's advertised
        # handshake params over a raw sync websocket. It ships in the dev
        # extra, which this job does not install.
        # matplotlib/networkx: test_topology_plots renders the topology PNGs.
        uv pip install pytest-asyncio pytest-timeout websocket-client
        uv pip install -e .[plot]

    - name: Run OVOS skill-execution E2E tests
      env:
        # libfann2 installs libdoublefann.so.2 under the multiarch lib dir;
        # ensure the dynamic loader finds it when fann2 imports _libfann.
        LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
      run: |
        # The ovos-m2v intent pipeline caches sklearn-pickled models across
        # sessions; a stale cache poisons matching (SG-7). Clear it first.
        rm -rf ~/.local/share/mycroft/intent_cache
        # ovoscope 0.19.0a1 ships a pytest11 plugin incompatible with pytest 9
        # (OpenVoiceOS/ovoscope#87) — disable it. MiniCroft boot + serial skill
        # handlers are slow, so widen the per-test timeout.
        # Glob the whole test_e2e_* suite instead of naming files: a named
        # list silently drops every module added later, which is how 13
        # modules ended up running in no job at all.
        #
        # Deny-list (--ignore=...): currently EMPTY. Every e2e module that
        # needs a skill this job does not install guards itself with
        # skill_missing()/skipif and skips cleanly. Add an --ignore line here
        # only for a module that cannot run at all, and say why.
        # Rebalanced again: shard 3 (misc_skills/multi_satellite/ocp/
        # relay_acl/relay_skills/ask_yesno_selection/solver_harness) blew the
        # 90-minute cap and got CANCELLED. Its per-test evidence (run
        # 30728800319, job "ovos-e2e (3)") shows test_e2e_ask_yesno_selection.py
        # is the dominant cost: 11 get_response-over-HiveMind tests that never
        # complete and each burn up to the full --timeout=300 per-test budget,
        # so the module alone can cost up to ~55 minutes worst case. Stacking
        # that on the same shard as the other slow modules (multi_satellite's
        # concurrent-utterance waits, and the relay_acl/relay_skills chains)
        # is what pushed the shard over the cap.
        #
        # Six shards now. ask_yesno_selection runs alone on shard 3 (its
        # worst case, ~55min, still has margin under 90min even with MiniCroft
        # boot on top). multi_satellite moves to shard 4 and the relay_* pair
        # moves to shard 5 — each on its own shard, away from ask_yesno_selection
        # and from each other, per the "spread the heavy cluster" requirement.
        # misc_skills/ocp/solver_harness (cheap in isolation — see the run
        # above, where they finished in seconds) backfill shard 4 so it is not
        # near-idle. test/test_e2e_sharding.py asserts every tests/test_e2e_*.py
        # is listed in exactly one shard, so a new module cannot silently run
        # in no job (the original bug) despite the explicit lists.
        case "${{ matrix.shard }}" in
          1) FILES="tests/test_e2e_acl_skills.py tests/test_e2e_admin_broadcast.py tests/test_e2e_binary_skill.py tests/test_e2e_lang.py tests/test_e2e_converse.py tests/test_helloworld_hivemind.py tests/test_ovoscope_integration.py" ;;
          2) FILES="tests/test_e2e_converse_advanced.py tests/test_e2e_get_response.py tests/test_protocol_v3_noise.py" ;;
          3) FILES="tests/test_e2e_ask_yesno_selection.py" ;;
          4) FILES="tests/test_e2e_misc_skills.py tests/test_e2e_multi_satellite.py tests/test_e2e_ocp.py tests/test_solver_harness.py" ;;
          5) FILES="tests/test_e2e_relay_acl.py tests/test_e2e_relay_skills.py" ;;
          6) FILES="tests/test_e2e_scheduler.py tests/test_e2e_session.py tests/test_e2e_shared_bus.py tests/test_e2e_skills.py tests/test_e2e_stop.py tests/test_e2e_volume_phal.py tests/test_topology_plots.py" ;;
        esac
        # -m "not slow" matches the harness-tests job above. Shard 6 carries
        # tests/test_topology_plots.py, whose TestPlotHugeHive and
        # TestPlotChaoticHive cases build 15-satellite hives and render them;
        # they cannot finish inside --timeout=300 and failed every PR here.
        # nightly-slow.yml already runs the slow-marked cases against the same
        # file with --timeout=1800, so deselecting them costs no coverage —
        # it just moves them off the PR critical path, which is what the
        # marker was introduced for.
        .venv/bin/python -m pytest $FILES \
          -p no:ovoscope --timeout=300 -v --tb=short -m "not slow"

  # Embedded interop, REQUIRED. Every embedded module guards its imports with
  # pytest.importorskip("hivemind.client" / "hivemind.crypto"), so without the
  # MicroPython client checkout the whole file skips cleanly instead of erroring
  # at collection. That makes this job safe to require: it proves the modules
  # still import, collect and (when the checkout is present) pass.
  embedded-tests:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      # See the harness-tests job above for why this installs from a frozen
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]

    - name: Run embedded interop tests
      # The embedded modules importorskip the MicroPython client, which is not
      # installable from public CI, so pytest collects nothing and exits 5
      # ("no tests ran"). That is the expected state today and must not fail
      # the job — but it must stay visible, so it is reported as a warning
      # annotation instead of being swallowed. Every other non-zero exit code
      # (1 = failures, 2 = interrupted, 3 = internal error, 4 = usage) still
      # fails the job.
      run: |
        set +e
        .venv/bin/python -m pytest tests/test_embedded_interop.py \
          tests/test_embedded_comprehensive.py -v --tb=short
        rc=$?
        set -e
        if [ "$rc" -eq 5 ]; then
          echo "::warning title=Embedded interop tests did not run::pytest exited 5 (no tests collected). The hivemind embedded client is not installable in public CI, so every embedded test skipped. This job proves the modules still import and collect — it does NOT prove the client works."
          exit 0
        fi
        exit "$rc"

  # The MicroPython client repo is PRIVATE, so CI's default GITHUB_TOKEN cannot
  # check it out and these two modules cannot actually exercise the client.
  # Best-effort until the repo is public or a cross-repo PAT is added; the
  # required embedded-tests job above covers the rest.
  micropython-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Checkout MicroPython client (private — needs a PAT to succeed)
      id: micropython_checkout
      # Job-level continue-on-error still reports the job conclusion as
      # "failure" to the checks API when a step fails, so the run looks red
      # while the client repo is private. Let the checkout fail softly and
      # gate the test step on it instead: the job then ends green and says
      # plainly that it did not test anything.
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: JarbasHiveMind/hivemind-micropython-client
        path: hivemind-micropython-client
        token: ${{ secrets.HIVEMIND_PAT || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      # See the harness-tests job above for why this installs from a frozen
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]

    - name: Run MicroPython client E2E tests
      if: steps.micropython_checkout.outcome == 'success'
      env:
        HIVEMIND_MICROPYTHON_CLIENT: ${{ github.workspace }}/hivemind-micropython-client
      run: |
        .venv/bin/python -m pytest tests/test_micropython_e2e.py \
          tests/test_embedded_clients.py -v --tb=short

    - name: Report that the MicroPython client was unavailable
      if: steps.micropython_checkout.outcome != 'success'
      run: |
        echo "::warning title=MicroPython E2E tests did not run::Could not check out JarbasHiveMind/hivemind-micropython-client. The repo is private; add a HIVEMIND_PAT secret with read access, or make the repo public, to get this coverage."

  js-e2e:
    runs-on: ubuntu-latest
    needs: harness-tests

    steps:
    - uses: actions/checkout@v4

    # The JS driver (test_helpers/js_e2e_driver.mjs) requires the HiveMind-js
    # client; check it out and point HIVEMIND_JS_PATH at its hivemind.js.
    - name: Checkout HiveMind-js
      uses: actions/checkout@v4
      with:
        repository: JarbasHiveMind/HiveMind-js
        ref: dev
        path: hivemind-js-src

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Node.js dependencies
      # local install (not -g) so the driver's `require('ws')` resolves by
      # walking up from test_helpers/ to the repo-root node_modules.
      run: |
        npm install ws

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install Python dependencies
      # See the harness-tests job above for why this installs from a frozen
      run: |
        uv venv
        uv pip install --prerelease=allow -e .[dev]

    - name: Run JS E2E tests
      env:
        HIVEMIND_JS_PATH: ${{ github.workspace }}/hivemind-js-src/static/js/hivemind.js
      run: |
        .venv/bin/python -m pytest tests/test_js_e2e.py -v --tb=short
